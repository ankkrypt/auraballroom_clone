<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Aura</title>


    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <!-- BootStrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>


    <!-- css files -->
    <link rel="stylesheet" href="./../style.css">
    <link rel="stylesheet" href="./contact.css" />

    <!-- scripts -->
    <script defer src="./contact.js"></script>
    <script defer src="./../script.js"></script>

</head>

<body>
    <section id="send_us_an_inquiry_section">
        <div id="send_us_an_inquiry_container" class="
            text-center 
            py-5
            ">
            <h1 class="h1">Send Us an Inquiry</h1>
            <p class="w-75 mx-auto">Tell us about your event and our team will get in touch to help you plan a seamless
                and unforgettable
                celebration at Aura Ballroom.</p>

            <!-- form -->
            <form id="form_container" class="
            container
            p-3
            pt-5
            rounded-5
            " style="
            background-color: transparent;
            background-image: linear-gradient(180deg, #4C301C 0%, #20110D 100%);
            ">

                <!-- splitforms secret api key -->
                <input type="hidden" name="access_key" value="bedd4b31514b4e378123f8d38917cc2c">

                <!-- first row for first last name -->
                <div class="row p-3">
                    <div class="text-start col-md-6">
                        <label for="firstName" class="form-label">First Name <span class="text-danger">*</span></label>
                        <input type="text" id="firstName" name="firstName" class="form-control p-2"
                            placeholder="First Name">
                    </div>
                    <div class="text-start  col-md-6">
                        <label for="lastName" class="form-label text-start">Last Name <span
                                class="text-danger">*</span></label>
                        <input type="text" id="lastName" name="lastName" class="form-control p-2"
                            placeholder="Last Name">
                    </div>
                </div>

                <!-- second row for phone email -->
                <div class="row p-3">
                    <div class=" text-start col-md-6">
                        <label for="PhoneNumber" class="form-label">Phone no <span class="text-danger">*</span></label>
                        <input type="tel" id="PhoneNumber" name="PhoneNumber" class="form-control p-2"
                            placeholder="+00 000 000 0000">
                    </div>
                    <div class=" text-start col-md-6">
                        <label for="email" class="form-label text-start">Email Address <span
                                class="text-danger">*</span></label>
                        <input type="email" id="email" name="email" class="form-control p-2"
                            placeholder="example@gmail.com">
                    </div>
                </div>

                <!-- third row for eventTypes eventDates -->
                <div class="row p-3">
                    <div class=" text-start col-md-6">
                        <label for="EventType" class="form-label">Event Type <span class="text-danger">*</span></label>
                        <select id="EventType" name="EventType" class="form-select p-2">
                            <option value="personal">Personal</option>
                            <option value="corporate">Corporate</option>
                            <option value="wedding">Wedding</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class=" text-start col-md-6">
                        <label for="EventDate" class="form-label text-start">Event Date <span
                                class="text-danger">*</span></label>
                        <input type="date" name="EventDate" id="EventDate" class="form-control p-2">
                    </div>
                </div>

                <!-- fourth row for guest count -->
                <div class="row p-3">
                    <div class="text-start">
                        <label for="GuestCount" class="form-label">Estimated guest count</label>
                        <input type="number" name="GuestCount" id="GuestCount" class="form-control p-2"
                            placeholder="200?">
                    </div>
                </div>

                <!-- fifth row for message -->
                <div class="row p-3">
                    <div class="text-start">
                        <label for="Message" class="form-label">Message/Special Request</label>
                        <textarea name="Message" id="Message" class="form-control p-2" rows="4"
                            placeholder="Type here . . ."></textarea>
                    </div>
                </div>

                <!-- bot check -->
                <input type="checkbox" name="botcheck" style="display:none">

                <!-- submit button -->
                <div class="row p-3">
                    <div class="text-center pt-5">
                        <button id="submit_form_btn" type="submit" class="p-3 rounded-5 border w-100" style="
                        border : none;
                        ">Schedule a Venue Tour</button>
                    </div>
                </div>

            </form>
        </div>
    </section>
</body>

</html>
